<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack AI</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .header {
      padding: 22px 18px;
      font-size: 28px;
      font-weight: bold;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px;
    }

    .msg {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 22px;
      margin-bottom: 16px;
      line-height: 1.4;
      font-size: 16px;
      word-wrap: break-word;
    }

    .user {
      background: transparent;
      color: white;
      text-align: right;
      width: 100%;
      margin-bottom: 20px;
    }

    .bot {
      background: transparent;
      color: white;
      text-align: left;
      width: 100%;
      margin-bottom: 20px;
    }

    .typing {
      color: #999;
      font-style: italic;
      margin-bottom: 14px;
    }

    .input-wrap {
      padding: 12px 14px 8px;
      background: #000;
    }

    .input-box {
      background: #1f1f1f;
      border-radius: 30px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 17px;
      padding: 10px;
    }

    button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 22px;
      cursor: pointer;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <span>✨ Jack AI</span>
      <span>+</span>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">Hi again! What’s on your mind?</div>
    </div>

    <div class="input-wrap">
      <div class="input-box">
        <span style="font-size:22px;">📎</span>
        <input id="msg" placeholder="Ask anything" onkeydown="handleEnter(event)">
        <span style="font-size:22px;">🎤</span>
        <button onclick="send()">➜</button>
      </div>
    </div>

    <div class="note">Jack AI can make mistakes.</div>
  </div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");
  input.value = "";
  input.focus();

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerText = "Jack is typing...";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: message })
  });

  const data = await res.json();

  typing.remove();
  addMessage(data.reply, "bot");
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function handleEnter(event) {
  if (event.key === "Enter") {
    send();
  }
}
</script>

</body>
</html>
