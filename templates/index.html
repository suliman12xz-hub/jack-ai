<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack AI</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:Arial, sans-serif; }

    body {
      height:100vh;
      background: radial-gradient(circle at center, #101b45 0%, #08090d 45%, #050505 100%);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .page {
      width:100%;
      max-width:1000px;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .title {
      font-size:42px;
      margin-bottom:45px;
      color:#e8e8e8;
      text-align:center;
      font-weight:400;
    }

    .input-box {
      width:100%;
      max-width:700px;
      background:#1f1f1f;
      border-radius:35px;
      padding:14px 18px;
      display:flex;
      align-items:center;
      gap:15px;
      box-shadow:0 0 40px rgba(30,60,160,0.25);
    }

    .plus, .mic {
      font-size:26px;
      color:#ddd;
    }

    input {
      flex:1;
      background:transparent;
      border:none;
      outline:none;
      color:white;
      font-size:18px;
    }

    button {
      border:none;
      background:#2b6cff;
      color:white;
      border-radius:50%;
      width:42px;
      height:42px;
      font-size:20px;
      cursor:pointer;
    }

    .chat {
      width:100%;
      max-width:700px;
      margin-top:35px;
      font-size:18px;
      line-height:1.5;
    }

    .user {
      text-align:right;
      margin-bottom:22px;
    }

    .bot {
      text-align:left;
      margin-bottom:22px;
    }

    .brand {
      position:absolute;
      top:25px;
      left:25px;
      font-size:28px;
      font-weight:bold;
    }

    .chat-mode {
      justify-content: flex-start;
    }

    .chat-mode .input-box {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 700px;
    }

    .chat-mode .chat {
      margin-top: 120px;
      padding-bottom: 120px;
    }

    @media(max-width:700px){
      .title { font-size:30px; margin-bottom:35px; }
      .input-box { max-width:95%; }
      .chat { max-width:95%; }
      .brand { font-size:22px; }
    }
  </style>
</head>

<body>
  <div class="brand">✨ Jack AI</div>

  <div class="page">
    <h1 class="title">How can I help you today?</h1>

    <div class="input-box">
      <input type="file" id="imageUpload" accept="image/*" style="display:none"><button type="button" class="plusBtn" onclick="document.getElementById('imageUpload').click()">+</button>
      <input id="msg" placeholder="Ask Jack" onkeydown="handleEnter(event)">
      <span class="mic">🎤</span>
      <button onclick="send()">➜</button>
    </div>

    <div class="chat" id="chat"></div>
  </div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  document.querySelector(".title").style.display = "none";
document.querySelector(".page").classList.add("chat-mode");
  addMessage(message, "user");
  input.value = "";
  input.focus();

  const res = await fetch("/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ message:message })
  });

  const data = await res.json();
  addMessage(data.reply, "bot");
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function handleEnter(event){
  if(event.key === "Enter") send();
}

document.getElementById("imageUpload").addEventListener("change", function(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    const chat = document.getElementById("chat");
    const img = document.createElement("img");

    img.src = e.target.result;
    img.style.maxWidth = "260px";
    img.style.borderRadius = "16px";
    img.style.display = "block";
    img.style.marginLeft = "auto";
    img.style.marginBottom = "18px";

    chat.appendChild(img);
    chat.scrollTop = chat.scrollHeight;
  };

  reader.readAsDataURL(file);
});
</script>
</body>
</html>
