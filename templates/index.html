<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack AI</title>
  <style>
    body { margin:0; background:#000; color:white; font-family:Arial; }
    .app { max-width:520px; margin:auto; min-height:100vh; display:flex; flex-direction:column; }
    .header { padding:20px; font-size:28px; font-weight:bold; border-bottom:1px solid #222; }
    .chat { flex:1; padding:20px; }
    .input-wrap { padding:15px; }
    .input-box { background:#222; border-radius:30px; padding:10px; display:flex; gap:10px; }
    input { flex:1; background:transparent; border:0; color:white; font-size:17px; outline:none; }
    button { border:0; border-radius:50%; width:42px; height:42px; font-size:20px; }
    .note { text-align:center; color:#777; padding-bottom:12px; }
    @media (min-width:900px) {
      .app { max-width:900px; height:90vh; margin-top:5vh; border:1px solid #222; border-radius:18px; }
      .chat { padding:30px 60px; }
      .input-wrap { padding:18px 60px 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">✨ Jack AI <span style="float:right">+</span></div>
    <div class="chat" id="chat">Hi again! What’s on your mind?</div>
    <div class="input-wrap">
      <div class="input-box">
        <span>📎</span>
        <input id="msg" placeholder="Ask anything" onkeydown="if(event.key==='Enter') send()">
        <span>🎤</span>
        <button onclick="send()">➜</button>
      </div>
    </div>
    <div class="note">Jack AI can make mistakes.</div>
  </div>

<script>
async function send() {
  const input = document.getElementById("msg");
  const message = input.value.trim();
  if (!message) return;

  const chat = document.getElementById("chat");
  chat.innerHTML += "<br><br><b>You:</b> " + message;

  input.value = "";
  input.focus();

  const res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({message: message})
  });

  const data = await res.json();
  chat.innerHTML += "<br><b>Jack:</b> " + data.reply;
}
</script>
</body>
</html>
