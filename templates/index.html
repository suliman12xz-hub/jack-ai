k<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:radial-gradient(circle at center,#0a2d7a,#020510 70%);
color:white;
}

#loader{
position:fixed;
inset:0;
background:#020510;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
font-weight:bold;
z-index:999;
animation:hideLoader 2.5s forwards;
}

@keyframes hideLoader{
0%,70%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

.app{
display:flex;
height:100vh;
animation:fadeIn .8s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(.97);}
to{opacity:1;transform:scale(1);}
}

.sidebar{
width:240px;
background:#030814;
border-right:1px solid #10234a;
padding:25px;
}

.sidebar h2{
margin-bottom:20px;
}

.sidebar button{
width:100%;
padding:12px;
margin-bottom:10px;
background:#071225;
border:1px solid #162b55;
border-radius:12px;
color:white;
cursor:pointer;
}

.sidebar button:hover{
box-shadow:0 0 15px #009dff;
}

.main{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.main h1{
font-size:42px;
margin-bottom:30px;
}

.options{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:120px;
}

.options button{
padding:12px 22px;
background:transparent;
border:1px solid #7a2cff;
border-radius:30px;
color:white;
cursor:pointer;
}

.options button:hover{
box-shadow:0 0 20px #8b3cff;
}

.chatbar{
position:absolute;
bottom:50px;
width:65%;
height:65px;
background:#050b1c;
border-radius:40px;
border:2px solid #0d8bff;
box-shadow:
0 0 25px #008cff,
0 0 25px #9b2cff inset;
display:flex;
align-items:center;
padding:0 15px;
}

.chatbar input{
flex:1;
background:transparent;
border:none;
outline:none;
color:white;
font-size:18px;
}

.chatbar button{
width:45px;
height:45px;
border-radius:50%;
border:none;
background:#6536ff;
color:white;
font-size:20px;
cursor:pointer;
box-shadow:0 0 18px #8b3cff;
}

#answer{
margin-top:20px;
color:#b8c7ff;
font-size:18px;
}
</style>
</head>

<body>

<div id="loader">Jack AI</div>

<div class="app">

<div class="sidebar">
<h2>Jack AI</h2>

<button onclick="newChat()">+ New Chat</button>
<button onclick="setMode('Chats')">💬 Chats</button>
<button onclick="setMode('Memory')">🧠 Memory</button>
<button onclick="startVoice()">🎤 Voice</button>
<button onclick="setMode('Files')">📁 Files</button>

</div>

<div class="main">

<h1 id="title">Need help with something?</h1>

<div class="options">
<button onclick="quick('Write a story')">✍️ Write a story</button>
<button onclick="quick('Workout plan')">🏃 Workout plan</button>
<button onclick="quick('Help me code')">💻 Help me code</button>
<button onclick="quick('Plan a trip')">✈️ Plan a trip</button>
</div>

<p id="answer"></p>

<div class="chatbar">
<input id="msg" placeholder="Ask Jack anything...">
<button onclick="send()">➜</button>
</div>

</div>
</div>

<script>

function setMode(mode){
document.getElementById("answer").innerText =
"Mode switched to: " + mode;
}

function quick(text){
document.getElementById("msg").value = text;
}

function newChat(){
document.getElementById("msg").value = "";
document.getElementById("answer").innerText =
"New chat started";
}

function startVoice(){
document.getElementById("answer").innerText =
"Voice mode activated";
}

function send(){
let msg = document.getElementById("msg").value;

if(msg.trim()==="") return;

document.getElementById("answer").innerText =
"Jack received: " + msg;
}

</script>

</body>
</html>
